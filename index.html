<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Investment Notes — 기업 리서치 보관소</title>
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <h1>Research</h1>
    <p class="subtitle">이미지 자료를 정리한 기업별 리서치 카드</p>
  </div>
</header>

<main class="wrap">
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="company">기업</button>
    <button class="tab-btn" data-tab="industry">산업</button>
    <button class="tab-btn" data-tab="favorites">★ 즐겨찾기</button>
  </div>

  <section id="fav-toolbar" class="fav-toolbar" hidden>
    <button id="fav-push" class="fav-push-btn" disabled>커밋 &amp; 푸시</button>
    <span id="fav-status" class="fav-status"></span>
    <button id="fav-token-toggle" class="fav-token-toggle" title="GitHub 토큰 설정">⚙ 토큰</button>
    <div id="fav-token-row" class="fav-token-row" hidden>
      <input id="fav-token-input" type="password" placeholder="GitHub PAT (Contents: Read and write)" autocomplete="off" spellcheck="false" />
      <button id="fav-token-save">저장</button>
      <button id="fav-token-clear">지우기</button>
      <p class="fav-token-hint">토큰은 이 브라우저(localStorage)에만 저장되며 repo에는 올라가지 않습니다. 공개 repo이므로 <b>fine-grained PAT</b>(이 repo 한정, Contents: Read and write) 사용을 권장합니다.</p>
    </div>
  </section>

  <section class="toolbar">
    <input id="q" type="search" placeholder="기업명·티커·태그 검색…" autocomplete="off" />
    <button id="sort-default" class="sort-btn active" title="등록 순서">기본순</button>
    <button id="sort-recent" class="sort-btn" title="최근 업데이트 기업 우선">최신순</button>
    <button id="sort-sector" class="sort-btn" title="섹터별 그룹 정렬">섹터순</button>
    <div id="counter" class="counter"></div>
  </section>

  <div id="sector-wrap" class="sector-wrap">
    <div id="sector-bar" class="sector-bar collapsed"></div>
    <button id="sector-toggle" class="sector-toggle" hidden>펼치기 ▾</button>
  </div>

  <section id="grid" class="grid">
    <!-- companies rendered here -->
  </section>

  <section id="empty" class="empty" hidden>
    <h2>아직 등록된 기업이 없어요</h2>
    <p>이미지를 업로드하면 Claude가 분석해 카드를 추가하고 GitHub에 자동 커밋합니다.</p>
  </section>
</main>

<footer class="footer">
  <div class="wrap">
    <span id="updated"></span>
    <a id="repolink" href="#" target="_blank" rel="noopener">GitHub Repo</a>
  </div>
</footer>

<script src="assets/app.js"></script>
</body>
</html>
